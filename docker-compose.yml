services:
  postgres:
    image: postgres:16-alpine
    container_name: zevapay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: zevapay
      POSTGRES_PASSWORD: zevapay
      POSTGRES_DB: zevapay
    ports:
      - "5432:5432"
    volumes:
      - zevapay_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zevapay -d zevapay"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  zevapay_pg:
